<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Calculator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #6c2cff55,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #00d9ff44,
                    transparent 30%
                ),
                #080812;
        }

        /* Calculator */

        .calculator {
            width: 350px;
            padding: 25px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Title */

        .title {
            color: white;

            text-align: center;

            font-size: 20px;

            margin-bottom: 20px;

            letter-spacing: 3px;
        }

        .title span {
            color: #8f5cff;
        }

        /* Display */

        #display {
            width: 100%;
            height: 90px;

            margin-bottom: 22px;

            padding: 15px 20px;

            border: none;
            outline: none;

            border-radius: 18px;

            background: rgba(0, 0, 0, 0.35);

            color: white;

            font-size: 36px;

            font-weight: bold;

            text-align: right;

            box-shadow:
                inset 0 0 15px rgba(0, 0, 0, 0.4);

            letter-spacing: 2px;
        }

        /* Button grid */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        /* Normal buttons */

        button {
            height: 65px;

            border: none;

            border-radius: 18px;

            color: white;

            background: rgba(255, 255, 255, 0.09);

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.25);
        }

        /* Hover */

        button:hover {
            background: rgba(255, 255, 255, 0.18);

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.35);
        }

        /* Click */

        button:active {
            transform: scale(0.92);
        }

        /* Operators */

        .operator {
            background:
                linear-gradient(
                    135deg,
                    #7b3cff,
                    #b44cff
                );

            box-shadow:
                0 5px 20px rgba(139, 70, 255, 0.4);
        }

        .operator:hover {
            background:
                linear-gradient(
                    135deg,
                    #955cff,
                    #c763ff
                );
        }

        /* Clear */

        .clear {
            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );

            box-shadow:
                0 5px 20px rgba(255, 65, 80, 0.35);
        }

        .clear:hover {
            background:
                linear-gradient(
                    135deg,
                    #ff557b,
                    #ff6245
                );
        }

        /* Equal */

        .equal {
            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                );

            box-shadow:
                0 5px 20px rgba(0, 160, 255, 0.4);
        }

        .equal:hover {
            background:
                linear-gradient(
                    135deg,
                    #20d0ff,
                    #1985ff
                );
        }

        /* Zero button */

        .zero {
            grid-column: span 2;
        }

        /* Mobile */

        @media (max-width: 400px) {

            .calculator {
                width: 92%;

                padding: 18px;
            }

            button {
                height: 58px;
            }

            #display {
                height: 80px;

                font-size: 30px;
            }
        }

    </style>
</head>


<body>

    <div class="calculator">

        <div class="title">
            <span>⚡</span> CALCULATOR
        </div>


        <input
            type="text"
            id="display"
            readonly
        >


        <div class="buttons">

            <!-- Row 1 -->

            <button onclick="addvalue('7')">
                7
            </button>

            <button onclick="addvalue('8')">
                8
            </button>

            <button onclick="addvalue('9')">
                9
            </button>

            <button
                class="operator"
                onclick="calc('/')"
            >
                ÷
            </button>


            <!-- Row 2 -->

            <button onclick="addvalue('4')">
                4
            </button>

            <button onclick="addvalue('5')">
                5
            </button>

            <button onclick="addvalue('6')">
                6
            </button>

            <button
                class="operator"
                onclick="calc('*')"
            >
                ×
            </button>


            <!-- Row 3 -->

            <button onclick="addvalue('1')">
                1
            </button>

            <button onclick="addvalue('2')">
                2
            </button>

            <button onclick="addvalue('3')">
                3
            </button>

            <button
                class="operator"
                onclick="calc('-')"
            >
                −
            </button>


            <!-- Row 4 -->

            <button
                class="zero"
                onclick="addvalue('0')"
            >
                0
            </button>

            <button
                class="clear"
                onclick="cleardata()"
            >
                C
            </button>

            <button
                class="operator"
                onclick="calc('+')"
            >
                +
            </button>

            <button
                class="equal"
                onclick="result()"
            >
                =
            </button>

        </div>

    </div>


    <script>

        // Clear display

        function cleardata() {

            document.getElementById("display").value = "";

        }


        // Add numbers to display

        function addvalue(inputnumber) {

            let display =
                document.getElementById("display");

            display.value += inputnumber;

        }


        // Add operator to display

        function calc(operator) {

            let display =
                document.getElementById("display");

            display.value += operator;

        }


        // Calculate result

        function result() {

            let display =
                document.getElementById("display");

            try {

                let input = display.value;

                let answer = eval(input);

                display.value = answer;

            }

            catch {

                display.value = "Invalid number";

            }

        }

    </script>

</body>

</html>
