<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS GRID</title>
    <STYLE>
        .parent {
            border: rgb(129, 108, 55) solid;
            background-color: rgb(119, 96, 90);
            height: 500px;
            width: 400px;
            display: grid;
            grid-template-columns:repeat(3,1fr) ;
 /* grid-auto-flow: row; */
 align-items: center;
 justify-content: space-evenly;
 border-radius: 10px;
 justify-self: center
 



        }

        .child {
            
            width: 80px;
            height: 80px;
            background-color: rgb(184, 224, 50);
            margin: 5px;
            border: rgb(60, 91, 19) solid 3px;
            text-align: center;
            align-content: center;
           border-radius: 10px;
           justify-self: center;
        }

        #id1 {
            grid-area: 2/2;

        }
    </STYLE>
</head>

<body>
    <div class="parent">
        <div id="id1" class="child"> 1 </div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
        <div class="child">7</div>
        <div class="child">8</div>
        <div class="child">9</div>
      
        
    </div>
</body>

</html>
