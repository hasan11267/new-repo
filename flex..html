<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FLEX BOX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+BR+Guides&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;

        }

.parent{
    background-color: rgb(223, 225, 99);
    height: 100px;
    width: 800px;
    display: flex;
    /* flex-direction: column-reverse; */
    justify-content: space-around;
    align-items: stretch;
    
    /* flex-wrap: nowrap; */
    
    

}
.child{
    background-color: green;
    height: 30px;
    width: 100px;
    border-radius: 5px;
    text-align: center;
    font-family:"Playwrite BR Guides",Arial, Helvetica, sans-serif;

    

}
#space{
    width: 100px;
}
.child:hover{
    background-color:rgb(128, 0, 0) ;
}
#child1{
    flex-basis: 100px;
    flex-grow: 2; 

}

    </style>
</head>
<body>
    <div class="parent">
        
        <div class="child" id="child1">child 1</div>
        <div class="child" id="child2">child 2</div>
        <div class="child" id="child3">child 3</div>
        <div class="child" id="child4">child 4</div>
        <div class="child" id="child5">child 5</div>
   
    
</body>
</html>
